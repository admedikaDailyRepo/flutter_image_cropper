group 'vn.hunghd.flutter.plugins.imagecropper'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.6.4'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'vn.hunghd.flutter.plugins.imagecropper'
    }
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 16
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    // TODO: COBA nanti menaikan versi uCrop nya nanti
    dependencies {
        // implementation 'com.github.yalantis:ucrop:2.2.10'
        implementation 'com.github.admedikaDailyRepo:uCrop:2.2.11-adding-padding-470238eb07-1'
        // OkHttp (WAJIB untuk menghilangkan error missing class)
        implementation 'com.squareup.okhttp3:okhttp:4.9.3'

        // Support FLAG_IMMUTABLE / FLAG_MUTABLE
        implementation 'androidx.core:core-ktx:1.10.1'
        implementation 'androidx.preference:preference:1.2.1'
    }
}
